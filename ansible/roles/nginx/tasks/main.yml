---

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Delete the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy the reverse proxy configuration.
  ansible.builtin.template:
    src: shiny.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    owner: root
    group: root
    mode: "0644"

- name: Activate the site {{ nginx_site_name }}
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
    state: link

- name: Validate the Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Setting up the Nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
