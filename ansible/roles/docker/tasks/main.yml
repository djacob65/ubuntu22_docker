---

- name: Update the apt cache
  apt:
    update_cache: yes

- name: Install the necessary dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create the directory for GPG keys
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add the Docker repository
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker and its components
  apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure that the Docker service is started and enabled.
  systemd:
    name: docker
    state: started
    enabled: true

- name: Copy the dock* files to /usr/local/bin
  copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item | basename }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ lookup('fileglob', 'files/dock*', wantlist=True) }}"
  become: true
