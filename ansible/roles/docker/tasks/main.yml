---

- name: Mettre à jour le cache apt
  apt:
    update_cache: yes

- name: Installer les dépendances nécessaires
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Créer le répertoire pour les clés GPG
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Ajouter la clé GPG officielle de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Installer Docker et ses composants
  apt:
    name: "{{ docker_packages }}"
    state: present

- name: S'assurer que le service Docker est démarré et activé
  systemd:
    name: docker
    state: started
    enabled: true

- name: Copier les fichiers dock* dans /usr/local/bin
  copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item | basename }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ lookup('fileglob', 'files/dock*', wantlist=True) }}"
  become: true
